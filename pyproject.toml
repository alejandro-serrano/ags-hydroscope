[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroscope"
version = "0.1.0"
description = "CNNs vs. a Vision Transformer for Sentinel-2 land-use classification in Aguascalientes, Mexico."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alejandro Serrano" }]
requires-python = ">=3.11"
# Dependencies are managed by environment.yml (conda-forge); see README.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["paper", "slides"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
