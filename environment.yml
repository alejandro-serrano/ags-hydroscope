name: hydroscope
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # Deep learning
  - pytorch=2.*
  - torchvision=0.*
  - timm=1.*
  - torchgeo=0.*
  - torchmetrics=1.*
  # Geospatial
  - rasterio=1.*
  - geopandas=1.*
  - earthengine-api=1.*
  # Data and plotting
  - pandas=2.*
  - pyarrow>=17
  - matplotlib=3.*
  - pillow
  - ipywidgets=8.*
  - pyyaml=6.*
  # Dev
  - pytest=8.*
  - ruff=0.*
  - pip
  - pip:
      - grad-cam==1.*
      - -e .
