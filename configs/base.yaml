# Shared experimental protocol v1.0 (docs/protocol.md, section 5). Every run config
# `extends: base.yaml` and sets ONLY run_id, model, bands and init. Changing any value here
# changes it for all models and must be recorded in docs/protocol.md in the same commit.
# Hardware: every run on the same GPU (recorded, not configurable).

protocol_version: "1.0"

run_id: null          # e.g. resnet50_rgb_imagenet
model: null           # resnet50 | efficientnet_b0 | vit_small
bands: null           # rgb (B04, B03, B02) | ms13 (B01…B12, B8A)
init: imagenet        # imagenet | ssl4eo (ms13 only; resnet50 MoCo, vit_small DINO)
seed: 0
device: auto          # auto | cuda | mps | cpu

data:
  dataset: eurosat                # TorchGeo EuroSAT MS, official split
  root: data/eurosat
  stats: data/eurosat/stats.json  # per-band mean/std computed on EuroSAT train only
  num_classes: 10
  patch_size: 64
  input_size: 224                 # resized from 64
  resize: bilinear
  normalization:                  # keyed by init
    imagenet: eurosat_train       # per-band stats from EuroSAT train (stats.json)
    ssl4eo: torchgeo              # TorchGeo's normalization for SSL4EO-S12 weights
  augment:
    hflip: true
    vflip: true
    rot90: true
  max_samples: null               # null = full split
  num_workers: 4

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.05
  batch_size: 64                  # effective batch size
  grad_accum_steps: 1             # raise only if 64 does not fit; effective batch stays 64

schedule:
  warmup_epochs: 1
  scheduler: cosine
  max_epochs: 15

early_stopping:
  monitor: val_macro_f1
  mode: max
  patience: 3

loss:
  eurosat: cross_entropy
  ags: class_weighted_cross_entropy

finetune:                         # Aguascalientes adaptation (protocol section 6, E4)
  modes: [head, last_block]
  epochs: 10

output:
  checkpoint_dir: checkpoints
  results_dir: experiments/results
